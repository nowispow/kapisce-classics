name: PR Preview & Cleanup

on:
  pull_request:
    branches:
      - main
      - development
    types: [opened, synchronize, reopened, closed]

jobs:
  preview:
    if: github.event.action != 'closed'
    defaults:
      run:
        working-directory: /workspace/selipso/kapisce-classics
    runs-on: self-hosted
    container:
      image: node:24-alpine
      volumes:
        - /workspace/selipso/kapisce-classics/dist:/workspace/selipso/kapisce-classics/dist
    steps:
      - name: Checkout Code
        uses: https://gitea.com/actions/checkout@v4

      - name: Install Dependencies
        run: npm install

      - name: Build Astro Project
        run: npm run build

      - name: Deploy Preview
        run: |
          # The node container needs docker-cli to talk to the host socket
          # Note: If this fails, ensure the runner mounts /usr/bin/docker or use a different build strategy
          apk add --no-cache docker-cli

          # Logic: Port = 20000 - PR_NUMBER
          PR_NUM=${{ github.event.number }}
          PREVIEW_PORT=$((20000 - PR_NUM))
          CONTAINER_NAME="kapisce-preview-pr-$PR_NUM"
          HOST_DIST_PATH="/workspace/selipso/kapisce-classics/dist-pr-$PR_NUM"

          # Copy build artifacts to the host-mounted directory
          mkdir -p $HOST_DIST_PATH
          cp -r dist/* $HOST_DIST_PATH/

          echo "Deploying PR #$PR_NUM to port $PREVIEW_PORT..."

          docker stop $CONTAINER_NAME || true
          docker rm $CONTAINER_NAME || true

          docker run -d \
            --name $CONTAINER_NAME \
            -v $HOST_DIST_PATH:/usr/share/nginx/html:ro \
            -p $PREVIEW_PORT:80 \
            --restart always \
            nginx:alpine

          echo "Preview live at: http://$(hostname -I | awk '{print $1}'):$PREVIEW_PORT"

  cleanup:
    if: github.event.action == 'closed'
    runs-on: self-hosted
    container:
      image: node:24-alpine
    steps:
      - name: Stop and Remove Preview Container
        run: |
          apk add --no-cache docker-cli
          PR_NUM=${{ github.event.number }}
          CONTAINER_NAME="kapisce-preview-pr-$PR_NUM"
          HOST_DIST_PATH="/workspace/selipso/kapisce-classics/dist-pr-$PR_NUM"

          docker stop $CONTAINER_NAME || true
          docker rm $CONTAINER_NAME || true

          rm -rf $HOST_DIST_PATH || true
