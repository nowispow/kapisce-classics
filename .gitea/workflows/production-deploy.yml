name: Production Build and Sync

on:
  push:
    tags:
      - 'v*'

jobs:
  build_and_sync:
    runs-on: self-hosted
    # We use a container to ensure Node.js is available regardless of the host environment
    container:
      image: node:20-alpine
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: npm install

      - name: Build Astro Project
        run: npm run build

      - name: Sync to Static Repo
        # This step needs to run on the host or a container with git/ssh setup
        # For now, we assume the host has git and the SSH key is provided
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STATIC_REPO_DEPLOY_KEY }}
        run: |
          # Install git and openssh in the alpine container if not present
          apk add --no-cache git openssh-client
          
          # Setup SSH key
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -t rsa git.kapisce.com >> ~/.ssh/known_hosts
          
          # Push dist folder to Repo B (kapisce-static)
          cd dist
          git init
          git config user.name "Kapisce Bot"
          git config user.email "bot@kapisce.com"
          git remote add origin git@git.kapisce.com:selipso/kapisce-static.git
          git checkout -b main
          git add .
          git commit -m "Deploying build for tag ${{ github.ref_name }}"
          git push origin main --force
