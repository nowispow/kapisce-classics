name: Preview Pull Request

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

jobs:
  preview:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Astro Project
        run: npm run build

      - name: Deploy Preview via Nginx Docker
        run: |
          # Stop existing preview container if it exists
          docker stop kapisce-preview-pr-${{ github.event.number }} || true
          docker rm kapisce-preview-pr-${{ github.event.number }} || true
          
          # Start Nginx container mapping port 20001 to 80
          docker run -d \
            --name kapisce-preview-pr-${{ github.event.number }} \
            -v $(pwd)/dist:/usr/share/nginx/html:ro \
            -p 20001:80 \
            nginx:alpine
